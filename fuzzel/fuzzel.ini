[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=yes
fields=filename,name,generic,exec
terminal=kitty
prompt="❯ "
icon-theme=Papirus
layer=top
corner-radius=8

[colors]
# Format: RRGGBBAA
background=231b15f0       # Dark warm background (94% opacity)
text=f5e0dcff             # Light warm text
match=e4963cff            # Amber match highlight
selection=3d2f24ff        # Warm brown hover/selection background
selection-text=f5e0dcff   # Selected text color
border=e4963cff           # Amber border

[border]
width=2
radius=8
